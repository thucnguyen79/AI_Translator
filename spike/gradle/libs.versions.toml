[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compileSdk = "37"
targetSdk = "36"
# Bergamot/Marian (pathie-cpp) needs glob() and iconv(), which Android's libc only has from API 28.
minSdk = "28"

coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
coroutines = "1.11.0"
mlkitTranslate = "17.0.3"
# sherpa-onnx AAR is fetched from GitHub Releases by tools/spike.py (see app/build.gradle.kts)
sherpaOnnx = "2.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
junit4 = { group = "junit", name = "junit", version = "4.13.2" }
# Java API for the Vietnamese punctuation model (sherpa-onnx links its own ONNX Runtime statically)
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version = "1.28.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
